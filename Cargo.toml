[package]
name = "veil"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "GPU-accelerated video wallpapers for Wayland compositors"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/veil"

[[bin]]
name = "veild"
path = "src/main.rs"

[[bin]]
name = "veilctl"
path = "src/bin/veilctl.rs"

[dependencies]
khronos-egl = { version = "6", features = ["static"] }
libc = "0.2"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wayland-client = "0.31"
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
